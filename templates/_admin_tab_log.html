<section class="admin-card" id="card-log">
    <h2>Verlauf</h2>
    <p class="admin-hint">Protokoll der Admin-Aktionen: Login/Logout, Uploads, Löschungen, GPS-/Notiz-/Favoriten-Änderungen, Routen-Korrekturen.</p>

    <input type="search" id="admin-log-search" class="admin-search-input"
           placeholder="Aktion oder Detail suchen…" aria-label="Verlauf durchsuchen">

    <ul id="admin-log-list" class="admin-log-list" aria-label="Aktionsprotokoll"></ul>

    <p id="admin-log-count" class="admin-hint"></p>

    <button type="button" id="admin-log-load-more" class="admin-load-more-btn" style="display:none;">
        Weitere laden
    </button>
</section>
